name: crew

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: crew
      POSTGRES_PASSWORD: crew
      POSTGRES_DB: crew
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crew"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

  # No object store here. In development Library files are kept in a folder on the server
  # (LIBRARY_STORAGE=local, LIBRARY_DIR). For production set LIBRARY_STORAGE=s3 and the
  # S3_* settings to any S3-compatible store.

volumes:
  pgdata:
  redisdata:

# The per-user cloud computers are NOT defined here.
# The DockerProvider starts one container per user from the crew-computer image:
#   docker build -t crew-computer:dev -f infra/computer/Dockerfile infra/computer
