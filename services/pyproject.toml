[project]
name = "crew-services"
version = "0.1.0"
description = "Crew backend: API, worker and shared package"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pydantic[email]>=2.9",
    "pydantic-settings>=2.6",
    "redis>=5",
    "arq>=0.26",
    "anthropic>=0.40",
    "httpx>=0.27",
    "structlog>=24.4",
    "cryptography>=43",
    "pyjwt>=2.9",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "mypy>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
dev-mode-dirs = [".", "shared"]

[tool.hatch.build.targets.wheel]
packages = ["api", "worker", "shared/crew"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "S", "RUF"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106"]

[tool.ruff.lint.isort]
known-first-party = ["api", "worker", "crew"]
known-third-party = ["alembic"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = ["shared", "."]
explicit_package_bases = true
namespace_packages = true
plugins = ["pydantic.mypy"]
exclude = ['^alembic/', '^\.venv/']

[[tool.mypy.overrides]]
module = ["arq.*", "asyncpg.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = ["integration: needs real Postgres and Redis (docker compose up)"]
