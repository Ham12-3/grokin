[package]
name = "crew-desktop"
version = "0.1.0"
description = "Crew desktop app"
authors = ["Crew"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "crew_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-deep-link = "2.6.3"
tauri-plugin-store = "2.5.1"
tauri-plugin-notification = "2.8.1"
tauri-plugin-window-state = "2.5.0"
tauri-plugin-log = "2.10.2"
tauri-plugin-autostart = "2.7.0"
log = "0.4.35"
thiserror = "2.0.21"
url = "2.5.9"
tauri-plugin-single-instance = { version = "2.5.5", features = ["deep-link"] }
sha2 = "0.10"
base64 = "0.22"
rand = "0.8"
uuid = { version = "1.29.3", features = ["v4"] }
tokio = { version = "1.54.1", features = ["sync", "fs", "time"] }
keyring = { version = "3", features = ["windows-native", "apple-native", "sync-secret-service"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[dev-dependencies]
tokio = { version = "1.54.1", features = ["macros", "rt"] }
